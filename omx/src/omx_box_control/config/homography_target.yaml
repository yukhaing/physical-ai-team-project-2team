camera_homography_target:
  ros__parameters:
    image_topic: /camera1/image_raw
    base_frame: link0
    target_z: 0.10
    reference_points_link0: [0.12, -0.10, 0.28, -0.10, 0.28, 0.10, 0.12, 0.10]
    target_pose_topic: /camera_box_target
    marker_topic: /camera_box_marker
    workspace_marker_topic: /camera_workspace_markers
    workspace_grid_resolution: 0.01
    workspace_center_x: -0.00999
    workspace_center_y: 0.0
    # Derived from the pitch-pregrasp IK at Z=130mm, pitch=70-80deg.
    safe_reach_radius: 0.280
    warning_reach_radius: 0.285
    workspace_marker_z: 0.002
    calibration_file: /tmp/omx_camera_homography.yaml
    show_window: true
