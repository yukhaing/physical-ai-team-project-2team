movej_xy_approach:
  ros__parameters:
    target_topic: /camera_box_target
    movej_topic: /omx_movej_controller/movej
    joint_states_topic: /joint_states
    controller_error_topic: /omx_movej_controller/controller_error
    base_frame: link0
    dry_run: true
    joint_names: [joint1, joint2, joint3, joint4, joint5]
    staging_positions: [0.0, -0.532389, 0.334964, 1.303389, 0.0]
    # Staging preserves the measured joint5 value while ID 15 is non-tracking.
    staging_ignored_joint_names: [joint5]
    joint_lower: [-4.71239, -2.0944, -2.0944, -1.74533, -4.71239]
    joint_upper: [6.28319, 1.5708, 1.5708, 1.74533, 4.71239]
    joint_limit_margin: 0.06
    staging_joint_tolerance: 0.042
    min_path_z: 0.12
    path_samples: 51
    # Approach repeatability straddled the former 5mm boundary (4.91/5.61mm).
    # Downstream pitch, gripper-open, and descent gates remain at 5mm.
    max_xy_error: 0.006
    target_max_age: 30.0
    min_x: 0.08
    max_x: 0.32
    max_abs_y: 0.25
    fk_position_bias: [0.00126, 0.0, 0.00055]
    xy_weight: 20000.0
    joint_delta_weight: 0.02
    height_reward: 0.01
    move_duration: 5.5
    minimum_completion_time: 6.5
    # Match the measured joint3 load-direction deadband used by staging.
    # Physical validation on 2026-08-06 reached 4.25 mm Cartesian XY error
    # while the remaining maximum joint error was 0.0447 rad.
    joint_tolerance: 0.05
    settle_time: 0.15
    timeout: 16.0
