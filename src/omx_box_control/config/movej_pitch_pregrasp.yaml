movej_pitch_pregrasp:
  ros__parameters:
    target_topic: /camera_box_target
    movej_topic: /omx_movej_controller/movej
    joint_states_topic: /joint_states
    controller_error_topic: /omx_movej_controller/controller_error
    base_frame: link0
    dry_run: true
    joint_names: [joint1, joint2, joint3, joint4, joint5]
    staging_positions: [0.0, -0.532389, 0.334964, 1.303389, 0.0]
    joint_lower: [-4.71239, -2.0944, -2.0944, -1.74533, -4.71239]
    joint_upper: [6.28319, 1.5708, 1.5708, 1.74533, 4.71239]
    joint_limit_margin: 0.06
    require_staging: false
    require_start_at_target: true
    start_xy_tolerance: 0.010
    start_min_z: 0.11
    min_path_z: 0.08
    # Begin feedback-gated descent closer to the lower test box.
    min_final_z: 0.08
    use_target_z: true
    target_z: 0.10
    z_tolerance: 0.0005
    min_pitch: 1.221730476
    max_pitch: 1.396263402
    preferred_pitch: 1.308996939
    pitch_weight: 2.0
    path_samples: 51
    max_xy_error: 0.005
    target_max_age: 30.0
    min_x: 0.08
    max_x: 0.32
    max_abs_y: 0.25
    fk_position_bias: [0.00126, 0.0, 0.00055]
    xy_weight: 20000.0
    joint_delta_weight: 0.02
    height_reward: 0.0
    move_duration: 4.0
    # Include controller settle, terminal trim, and application settle.
    minimum_completion_time: 5.0
    # Physical validation reached the Cartesian target (2.02mm XY, 134.7mm Z)
    # with up to 0.0438rad residual joint error. Include that measured deadband
    # while retaining the independent XY, Z, and pitch completion gates.
    # 2026-08-11: measured Cartesian pose was valid while the maximum residual
    # joint error was 0.0473rad (2.71deg). Keep independent XY/Z/pitch gates.
    joint_tolerance: 0.050
    settle_time: 0.15
    timeout: 12.0
