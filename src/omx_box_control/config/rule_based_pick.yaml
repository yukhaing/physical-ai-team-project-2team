rule_based_pick:
  ros__parameters:
    target_topic: /camera_box_target
    current_pose_topic: /omx_movel_controller/current_pose
    movel_topic: /omx_movel_controller/movel
    gripper_action: /gripper_controller/gripper_cmd
    controller_error_topic: /omx_movel_controller/controller_error
    base_frame: link0
    dry_run: false
    movej_staging_done: true
    lift_after_grasp: false
    approach_offset: 0.05
    grasp_offset: 0.0
    lift_offset: 0.05
    move_duration: 6.0
    position_tolerance: 0.008
    orientation_tolerance: 0.05
    settle_time: 0.30
    state_timeout: 12.0
    max_motion_retries: 2
    retry_max_error: 0.05
    target_max_age: 30.0
    staging_x: 0.18
    staging_y: 0.0
    staging_z: 0.14
    staging_pitch: 1.20
    tool_pitch: 1.25
    open_position: 1.0
    closed_position: 0.0
    gripper_effort: 10.0
    min_x: 0.08
    max_x: 0.32
    max_abs_y: 0.25
    min_z: 0.01
    max_z: 0.32
