movej_place_recovery:
  ros__parameters:
    target_topic: /pick_coordinator/place_target
    movej_topic: /pick_coordinator/commands/place_recovery
    joint_states_topic: /joint_states
    controller_error_topic: /omx_movej_controller/controller_error
    base_frame: link0
    dry_run: true
    joint_names: [joint1, joint2, joint3, joint4, joint5]
    staging_positions: [0.0, -0.532389, 0.334964, 1.303389, 0.0]
    staging_ignored_joint_names: [joint5]
    joint_lower: [-4.71239, -2.0944, -2.0944, -1.74533, -4.71239]
    joint_upper: [6.28319, 1.5708, 1.5708, 1.74533, 4.71239]
    joint_limit_margin: 0.06
    require_staging: false
    require_start_at_target: false
    require_start_pitch: false
    # Keep the loaded transfer high while solving place XY and pitch. The
    # feedback-gated place descent is the only stage allowed to approach the box.
    use_target_z: true
    # 100mm is the highest practical target with the remembered place XY and
    # 78-82deg pitch while retaining Cartesian XY margin. At 123.6mm joint4
    # saturates and the planned XY error grows to about 27mm.
    target_z: 0.100
    z_tolerance: 0.001
    z_weight: 20000.0
    min_path_z: 0.075
    min_final_z: 0.075
    # Reject the former physical overshoot to 38.9mm while retaining 25mm of
    # measured tracking allowance around the 100mm transfer target.
    require_actual_target_z: true
    actual_target_z_tolerance: 0.025
    path_samples: 51
    min_pitch: 1.361356817
    max_pitch: 1.431169987
    preferred_pitch: 1.396263402
    pitch_weight: 20.0
    max_xy_error: 0.010
    target_max_age: 300.0
    # Match the expanded place-only X bound used by the normal transfer.
    min_x: -0.070
    max_x: 0.32
    max_abs_y: 0.25
    fk_position_bias: [0.00126, 0.0, 0.00055]
    xy_weight: 20000.0
    # Prioritize the Cartesian endpoint over staying near the loaded-lift
    # joints; 10.0 produced a 17-27mm planned XY miss at high transfer Z.
    joint_delta_weight: 0.02
    candidate_xy_slack: 0.0005
    height_reward: 0.0
    move_duration: 5.0
    minimum_completion_time: 8.0
    joint_tolerance: 0.050
    settle_time: 0.30
    timeout: 16.0
